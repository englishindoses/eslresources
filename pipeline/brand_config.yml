# ─────────────────────────────────────────────────────────────
#  Canva Settings
# ─────────────────────────────────────────────────────────────
#
#  SETUP STEPS:
#  1. Create an Instagram carousel brand template in Canva (6 pages).
#  2. In each page, add text elements and mark them as "Brand template
#     fields" using the field names listed below under autofill_fields.
#     (Template editor → select element → Brand template field → name it)
#  3. Find your template ID in the Canva URL:
#     https://www.canva.com/design/YOUR_TEMPLATE_ID/edit
#  4. Add CANVA_BRAND_TEMPLATE_ID as a GitHub Secret (recommended),
#     or paste the ID directly below (not recommended for public repos).
#
canva:
  brand_template_id: "YOUR_CANVA_BRAND_TEMPLATE_ID"

  slides_count: 6

  # Map: content key (used in topic_selector output) → Canva field name
  # If your Canva field names differ, update the values on the right.
  autofill_fields:
    hook_title: "hook_title"           # Slide 1 — big hook headline
    hook_subtitle: "hook_subtitle"     # Slide 1 — swipe-bait subtext
    tip_1_heading: "tip_1_heading"     # Slide 2
    tip_1_body: "tip_1_body"
    tip_2_heading: "tip_2_heading"     # Slide 3
    tip_2_body: "tip_2_body"
    tip_3_heading: "tip_3_heading"     # Slide 4
    tip_3_body: "tip_3_body"
    tip_4_heading: "tip_4_heading"     # Slide 5
    tip_4_body: "tip_4_body"
    cta_heading: "cta_heading"         # Slide 6 — call to action
    cta_body: "cta_body"

# ─────────────────────────────────────────────────────────────
#  ESL Content Pipeline — Brand & Strategy Configuration
#  Fill in every section before running the pipeline.
# ─────────────────────────────────────────────────────────────

brand:
  name: "English in Doses"
  tagline: "Short, clear English lessons you can fit into your day"

  tone:
    - warm
    - encouraging
    - professional
    - approachable

  target_audience:
    description: >
      Adult learners aged 25–45 who want to improve their English for work
      or daily life. Many are professionals, immigrants, or people who feel
      stuck at an intermediate plateau.
    language_levels:
      - A2 (Elementary)
      - B1 (Pre-Intermediate)
      - B2 (Upper Intermediate)
    goals:
      - speak confidently in meetings and with colleagues
      - reduce grammar mistakes in emails and messages
      - understand native speakers more easily
      - build vocabulary for professional contexts
    pain_points:
      - embarrassed by errors in front of colleagues or clients
      - feel stuck at the same level despite years of study
      - no time for long lessons — need quick, practical tips
      - worried about forgetting new vocabulary quickly

  content_pillars:
    - Common grammar mistakes and corrections
    - Vocabulary for daily and professional life
    - Business English phrases and expressions
    - Speaking confidence and fluency tips
    - Pronunciation and word stress
    - Tense comparisons (e.g. past simple vs present perfect)
    - Confusing word pairs (e.g. make vs do, say vs tell)

  avoid:
    - political or divisive topics
    - content aimed at children or teenagers
    - overly academic or linguistic jargon
    - trending topics unrelated to English learning
    - content that feels condescending or preachy

